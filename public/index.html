<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPPTYM - AI Powered Automation</title>
    <meta name="description" content="Submit your business to multiple directories with ease">
    
    <!-- Aggressive Cache Control -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Surrogate-Control" content="no-store">
    
    <!-- Force Cache Busting -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=<script>document.write(Date.now())</script>">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="/src/main.tsx?v=<script>document.write(Date.now())</script>" as="script">
    
    <style>
        /* Loading spinner */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        

    </style>
</head>
<body>

    
    <div id="root">
        <div class="loading-spinner">
            <div>
                <div class="spinner"></div>
                <p>Loading Opptym...</p>
            </div>
        </div>
    </div>

    <!-- Cache Busting Script -->
    <script>
        (function() {
            console.log('🔄 OPPTYM App loading...');
            
            // Add timestamp to prevent caching
            const timestamp = Date.now();
            window.__CACHE_BUST__ = timestamp;
            console.log('✅ Cache busting complete:', timestamp);
            
            console.log('🚀 OPPTYM HTML loaded at', new Date().toISOString());
        })();
    </script>

    <!-- Main App Script with Cache Busting -->
    <script type="module" src="/src/main.tsx?v=<script>document.write(Date.now())</script>"></script>
</body>
</html>
