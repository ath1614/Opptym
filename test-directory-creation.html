<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory Creation Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        input, textarea, select { width: 100%; padding: 8px; margin: 5px 0; }
        .form-group { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🧪 Directory Creation Test</h1>
    <p>This page tests the directory creation functionality directly against the API.</p>
    
    <div id="results"></div>
    
    <div class="test-section">
        <h3>Test Directory Creation</h3>
        <form id="directoryForm">
            <div class="form-group">
                <label>Directory Name:</label>
                <input type="text" id="name" value="Test Directory" required>
            </div>
            <div class="form-group">
                <label>Domain:</label>
                <input type="text" id="domain" value="test-directory.com" required>
            </div>
            <div class="form-group">
                <label>Description:</label>
                <textarea id="description">Test directory for API testing</textarea>
            </div>
            <div class="form-group">
                <label>Classification:</label>
                <select id="classification">
                    <option value="Directory Submission">Directory Submission</option>
                    <option value="Article Submission">Article Submission</option>
                    <option value="Press Release">Press Release</option>
                    <option value="BookMarking">BookMarking</option>
                    <option value="Business Listing">Business Listing</option>
                    <option value="Classified">Classified</option>
                    <option value="More SEO">More SEO</option>
                </select>
            </div>
            <div class="form-group">
                <label>Submission URL:</label>
                <input type="url" id="submissionUrl" value="https://test-directory.com/submit" required>
            </div>
            <button type="submit">Create Directory</button>
        </form>
    </div>
    
    <div class="test-section">
        <h3>API Tests</h3>
        <button onclick="testAPIHealth()">Test API Health</button>
        <button onclick="testDirectoryEndpoint()">Test Directory Endpoint</button>
        <button onclick="testWithInvalidAuth()">Test Invalid Auth</button>
    </div>

    <script>
        const API_BASE = 'https://api.opptym.com';
        
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-section ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            results.appendChild(div);
        }
        
        async function testAPIHealth() {
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                const data = await response.json();
                addResult(`✅ API Health: ${data.status} (Version: ${data.version})`, 'success');
            } catch (error) {
                addResult(`❌ API Health failed: ${error.message}`, 'error');
            }
        }
        
        async function testDirectoryEndpoint() {
            try {
                const response = await fetch(`${API_BASE}/api/admin/directories`);
                addResult('❌ Directory endpoint should require authentication', 'error');
            } catch (error) {
                if (error.message.includes('401')) {
                    addResult('✅ Directory endpoint correctly requires authentication', 'success');
                } else {
                    addResult(`❌ Unexpected error: ${error.message}`, 'error');
                }
            }
        }
        
        async function testWithInvalidAuth() {
            try {
                const response = await fetch(`${API_BASE}/api/admin/directories`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer invalid-token'
                    },
                    body: JSON.stringify({ name: 'test' })
                });
                addResult('❌ Should reject invalid token', 'error');
            } catch (error) {
                addResult('✅ Correctly rejects invalid token', 'success');
            }
        }
        
        document.getElementById('directoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                domain: document.getElementById('domain').value,
                description: document.getElementById('description').value,
                classification: document.getElementById('classification').value,
                submissionUrl: document.getElementById('submissionUrl').value,
                category: 'business',
                country: 'Global',
                pageRank: 3,
                daScore: 30,
                spamScore: 2,
                isPremium: false,
                requiresApproval: true,
                contactEmail: 'admin@test.com',
                submissionGuidelines: 'Test guidelines',
                priority: 10,
                freeUserLimit: 0,
                starterUserLimit: 5,
                proUserLimit: 20,
                businessUserLimit: 50,
                enterpriseUserLimit: -1
            };
            
            addResult('🚀 Attempting to create directory...', 'info');
            addResult(`📡 Using endpoint: ${API_BASE}/api/admin/directories`, 'info');
            addResult(`📋 Data: ${JSON.stringify(formData, null, 2)}`, 'info');
            
            try {
                const response = await fetch(`${API_BASE}/api/admin/directories`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer invalid-token' // This will fail, but shows the endpoint is working
                    },
                    body: JSON.stringify(formData)
                });
                
                if (response.ok) {
                    addResult('✅ Directory created successfully!', 'success');
                } else {
                    addResult(`❌ Directory creation failed: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                if (error.message.includes('401')) {
                    addResult('✅ API endpoint is working (correctly requires valid authentication)', 'success');
                } else {
                    addResult(`❌ Error: ${error.message}`, 'error');
                }
            }
        });
        
        // Run initial tests
        window.onload = () => {
            testAPIHealth();
            testDirectoryEndpoint();
        };
    </script>
</body>
</html>
